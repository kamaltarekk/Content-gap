[project]
name = "content-diagnosis-backend"
version = "0.0.0"
description = "Evidence-Based Content Diagnosis & Competitive Gap Analysis — backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.4",
  "pydantic[email]>=2.10.4",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.7.0",
  "redis>=5.2.1",
  "celery>=5.4.0",
  "minio>=7.2.13",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "itsdangerous>=2.2.0",
  "structlog>=24.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.1",
  "asgi-lifespan>=2.1.0",
  "fakeredis>=2.26.1",
  "factory-boy>=3.3.1",
  "reportlab>=4.2.5",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `= Depends(...)` default is the framework's intended idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
