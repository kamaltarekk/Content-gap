# Lightweight dependencies for running the test suite (CI / local).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cgi
      POSTGRES_PASSWORD: cgi
      POSTGRES_DB: cdga_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgi -d cdga_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6390:6379"
